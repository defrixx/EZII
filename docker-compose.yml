services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 20}
  qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    volumes: [qdrant_data:/qdrant/storage]
  mock-llm:
    image: python:3.12-alpine
    profiles: [test]
    command: [python, /app/mock_llm.py]
    volumes: [./scripts/mock_llm.py:/app/mock_llm.py:ro]
    ports: ["127.0.0.1:12345:1234"]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      QDRANT_URL: http://qdrant:6333
      PROVIDER_API_KEY_ENCRYPTION_KEY: ${PROVIDER_API_KEY_ENCRYPTION_KEY:-}
      LOCAL_MODEL_HOSTS: ${LOCAL_MODEL_HOSTS:-host.docker.internal,localhost,127.0.0.1,::1}
      DOCUMENT_UPLOAD_MAX_BYTES: ${DOCUMENT_UPLOAD_MAX_BYTES:-52428800}
      WEBSITE_SNAPSHOT_MAX_BYTES: ${WEBSITE_SNAPSHOT_MAX_BYTES:-10485760}
      DOCUMENT_CHUNK_SIZE_CHARS: ${DOCUMENT_CHUNK_SIZE_CHARS:-900}
      DOCUMENT_CHUNK_OVERLAP_CHARS: ${DOCUMENT_CHUNK_OVERLAP_CHARS:-250}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [documents_data:/app/data/documents, secrets_data:/app/data/secrets]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 5s, timeout: 3s, retries: 20}
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment: {NEXT_PUBLIC_API_BASE: /api/v1}
    depends_on:
      backend: {condition: service_healthy}
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    volumes: [./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [frontend, backend]
volumes: {pgdata: {}, qdrant_data: {}, documents_data: {}, secrets_data: {}}
